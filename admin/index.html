<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1017">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ניהול כושר">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ניהול קישורי הפעלה</title>
<style>
  :root { --bg: #f1f4f9; --card: #fff; --ink: #121a2b; --muted: #5f6b82; --faint: #8b95a8; --line: #e1e6ef; --soft: #f4f6fa; --pri: #c2551b; --pri2: #ff8a4c; --on-pri: #1b0f06;
    --ok: #17834a; --warn: #b26a08; --bad: #c93030; --info: #1f6fd0; --shadow: 0 1px 2px rgba(16, 30, 60, .05), 0 8px 24px rgba(16, 30, 60, .06);
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1017; --card: #131b27; --ink: #edf1f7; --muted: #9aa6ba; --faint: #6f7b90; --line: #232e40; --soft: #18212f; --pri: #ff8a4c; --pri2: #ffa66e;
    --ok: #55d08c; --warn: #f3b552; --bad: #ff8080; --info: #6fb0ff; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .28); color-scheme: dark; } }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; padding-bottom: calc(96px + var(--sab)); -webkit-tap-highlight-color: transparent; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  :focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; }

  /* ראש העמוד */
  .top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); padding: calc(var(--sat) + 10px) 16px 10px; }
  .top-in { max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .top img { width: 40px; height: 40px; border-radius: 12px; flex: none; box-shadow: 0 3px 10px rgba(0, 0, 0, .25); }
  .top h1 { font-size: 18px; line-height: 1.2; letter-spacing: -.01em; }
  .top p { font-size: 12.5px; color: var(--muted); }
  .top .sp { flex: 1; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--muted); }
  .icon-btn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(-360deg); } }

  main { max-width: 820px; margin: 0 auto; padding: 14px 14px 0; display: grid; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); }
  h2 { font-size: 16px; letter-spacing: -.01em; }
  .sec-h { display: flex; align-items: center; gap: 8px; margin: 6px 2px -4px; color: var(--muted); font-size: 12.5px; font-weight: 700; letter-spacing: .04em; }
  .sec-h .sp { flex: 1; }
  .muted { color: var(--muted); } .small { font-size: 13.5px; }
  label.f { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  input, select { padding: 12px 13px; border-radius: 13px; border: 1.5px solid var(--line); background: var(--soft); min-width: 0; width: 100%; font-size: 16px; }
  input:focus, select:focus { outline: 0; border-color: var(--pri); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pri) 22%, transparent); }
  .btn { border: 0; font-weight: 700; padding: 13px 18px; border-radius: 14px; color: var(--on-pri); background: linear-gradient(145deg, var(--pri2), var(--pri)); box-shadow: 0 6px 16px color-mix(in srgb, var(--pri) 28%, transparent); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.block { width: 100%; }
  .btn.ghost { background: var(--soft); color: var(--ink); box-shadow: none; border: 1px solid var(--line); }
  .btn.danger { background: color-mix(in srgb, var(--bad) 14%, var(--card)); color: var(--bad); box-shadow: none; border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); }
  .btn:disabled { opacity: .55; }
  .chip { border: 1px solid var(--line); background: var(--card); font-weight: 600; font-size: 13.5px; padding: 8px 12px; border-radius: 999px; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .chip svg.i { width: 15px; height: 15px; }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip .n { font-size: 11.500px; font-weight: 700; opacity: .7; font-variant-numeric: tabular-nums; }
  .chip.bad { color: var(--bad); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -14px; padding-inline: 14px; } .scroll::-webkit-scrollbar { display: none; }

  /* מספרים */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 12px 11px; box-shadow: var(--shadow); text-align: start; min-width: 0; }
  .stat b { display: block; font-size: 27px; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .stat span { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .stat small { display: block; font-size: 11.500px; color: var(--faint); }
  .stat.ok b { color: var(--ok); } .stat.w b { color: var(--warn); } .stat.b b { color: var(--bad); }
  @media (max-width: 560px) { .stats { grid-template-columns: repeat(2, 1fr); } }

  /* אפליקציות */
  .apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .app { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px; box-shadow: var(--shadow); display: grid; gap: 9px; min-width: 0; }
  .app-h { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .app-h img { width: 36px; height: 36px; border-radius: 11px; flex: none; }
  .app-h b { font-size: 15.500px; line-height: 1.15; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .app-h small { font-size: 12px; color: var(--muted); display: block; }
  .app-f { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  /* בטלפון: כרטיס לכל אפליקציה ברוחב מלא — שם ומונים למעלה, והמתג, המצב והסטטיסטיקה בשורה משלהם מתחת (אחרת הם דוחקים את השם החוצה) */
  @media (max-width: 560px) { .apps { grid-template-columns: 1fr; } .app-h small { white-space: nowrap; } }
  .app-f .chip { flex: none; } .app-f .pill { flex: none; } .app-f .tog { margin-inline-start: auto; flex: none; }
  .tog { flex: none; width: 50px; height: 30px; border-radius: 999px; border: 0; background: var(--line); position: relative; transition: background .2s; }
  .tog::after { content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0, 0, 0, .3); transition: transform .2s; }
  .prow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 2px; border-top: 1px solid var(--line); font-weight: 600; font-size: 15.5px; }
  .prow small { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); }
  .pg { margin: 14px 0 4px; font-size: 13px; color: var(--muted); } .pg + .prow { border-top: 0; }
  .pscroll { max-height: 52vh; overflow-y: auto; margin-bottom: 12px; }
  .tog.on { background: var(--ok); } .tog.on::after { transform: translateX(-20px); }
  .pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; color: var(--c, var(--muted)); background: color-mix(in srgb, var(--c, var(--muted)) 13%, transparent); }
  .pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.plain::before { display: none; }
  .c-ok { --c: var(--ok); } .c-warn { --c: var(--warn); } .c-bad { --c: var(--bad); } .c-info { --c: var(--info); } .c-pri { --c: var(--pri); }

  /* חיפוש וסינון */
  .search { position: relative; }
  .search svg { position: absolute; inset-inline-start: 13px; top: 50%; transform: translateY(-50%); color: var(--faint); }
  .search input { padding-inline-start: 40px; background: var(--card); }
  .tools { display: grid; gap: 10px; }

  /* כרטיס קישור */
  #list { display: grid; gap: 10px; }
  .pass { background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
  .pass-b { padding: 14px 14px 12px; display: grid; gap: 11px; }
  .pass-h { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .av { width: 46px; height: 46px; border-radius: 15px; flex: none; display: grid; place-items: center; font-weight: 800; font-size: 16px; color: #fff; background: var(--c, var(--pri)); position: relative; }
  .av img { position: absolute; inset-block-end: -5px; inset-inline-end: -5px; width: 21px; height: 21px; border-radius: 7px; border: 2px solid var(--card); }
  .pass-h .who { flex: 1; min-width: 0; }
  .pass-h h3 { font-size: 17px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pass-h .sub { font-size: 12.5px; color: var(--muted); }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .fact { background: var(--soft); border-radius: 13px; padding: 8px 10px; min-width: 0; }
  .fact small { display: block; font-size: 11.500px; color: var(--muted); font-weight: 600; }
  .fact b { display: block; font-size: 14px; line-height: 1.25; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .life { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 6px; } .life i { display: block; height: 100%; border-radius: 4px; background: var(--ok); }
  .life.w i { background: var(--warn); } .life.b i { background: var(--bad); }
  .heat { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; }
  .heat i { aspect-ratio: 1; border-radius: 4px; background: var(--line); }
  .heat i.l1 { background: color-mix(in srgb, var(--pri) 38%, var(--line)); } .heat i.l2 { background: color-mix(in srgb, var(--pri) 68%, var(--line)); } .heat i.l3 { background: var(--pri); }
  .heat i.today { outline: 1.500px solid var(--ink); outline-offset: 1px; }
  .cap { display: flex; justify-content: space-between; font-size: 11.500px; color: var(--faint); margin-top: 5px; }
  .hrs { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; align-items: end; height: 46px; direction: ltr; }
  .hrs i { background: color-mix(in srgb, var(--info) 75%, var(--line)); border-radius: 2px 2px 0 0; min-height: 2px; }
  .hrs i.z { background: var(--line); }
  .hrs-x { display: flex; justify-content: space-between; direction: ltr; font-size: 11px; color: var(--faint); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .pass-a { display: flex; border-top: 1px solid var(--line); }
  .pass-a button { flex: 1; border: 0; background: transparent; padding: 11px 6px; font-weight: 600; font-size: 13.5px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .pass-a button + button { border-inline-start: 1px solid var(--line); }
  .pass-a button.pri { color: var(--pri); }
  details.act { border-top: 1px solid var(--line); }
  details.act summary { list-style: none; padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 6px; cursor: pointer; }
  details.act summary::-webkit-details-marker { display: none; }
  details.act summary .sp { flex: 1; }
  details.act summary svg { transition: transform .2s; } details.act[open] summary svg.chev { transform: rotate(180deg); }
  .act-b { padding: 2px 14px 14px; display: grid; gap: 12px; }
  .act-b h4 { font-size: 12.5px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .link { direction: ltr; text-align: left; font: 12px ui-monospace, Menlo, monospace; background: var(--soft); border-radius: 11px; padding: 9px 11px; overflow-wrap: anywhere; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 34px 16px; border: 1.500px dashed var(--line); border-radius: 20px; }
  .empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 2px; }
  .skel { height: 132px; border-radius: 20px; background: linear-gradient(100deg, var(--card) 30%, var(--soft) 50%, var(--card) 70%); background-size: 300% 100%; animation: sk 1.2s linear infinite; border: 1px solid var(--line); }
  @keyframes sk { to { background-position: -150% 0; } }

  /* כפתור הנפקה צף */
  .fab { position: fixed; inset-inline: 0; bottom: calc(16px + var(--sab)); z-index: 6; display: flex; justify-content: center; pointer-events: none; }
  .fab .btn { pointer-events: auto; padding: 15px 26px; border-radius: 999px; font-size: 16.500px; box-shadow: 0 10px 28px color-mix(in srgb, var(--pri) 42%, transparent); }

  /* חלונית */
  .ov { position: fixed; inset: 0; z-index: 20; background: rgba(5, 9, 16, .55); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s; }
  .sheet { background: var(--card); width: 100%; max-width: 520px; border-radius: 24px 24px 0 0; padding: 10px 18px calc(18px + var(--sab)); max-height: 92dvh; overflow: auto; animation: up .22s cubic-bezier(.2, .8, .2, 1); display: grid; gap: 14px; }
  .sheet::before { content: ''; width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 2px; }
  .sheet h3 { font-size: 20px; letter-spacing: -.01em; }
  @media (min-width: 620px) { .ov { align-items: center; } .sheet { border-radius: 24px; } .sheet::before { display: none; } .sheet { padding-top: 20px; } }
  @keyframes fade { from { opacity: 0; } } @keyframes up { from { transform: translateY(30px); opacity: .4; } }
  .pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pick button { border: 1.500px solid var(--line); background: var(--soft); border-radius: 15px; padding: 11px 6px; display: grid; justify-items: center; gap: 6px; font-weight: 700; font-size: 13.5px; }
  .pick button img { width: 38px; height: 38px; border-radius: 11px; }
  .pick button.on { border-color: var(--pri); background: color-mix(in srgb, var(--pri) 10%, var(--card)); }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opts button { border: 1.500px solid var(--line); background: var(--soft); border-radius: 12px; padding: 9px 13px; font-weight: 600; font-size: 14px; }
  .opts button.on { border-color: var(--pri); background: color-mix(in srgb, var(--pri) 10%, var(--card)); color: var(--pri); }
  .menu { display: grid; }
  .menu button { border: 0; background: transparent; text-align: start; padding: 13px 4px; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line); }
  .menu button:first-child { border-top: 0; }
  .menu button small { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); }
  .menu button.bad { color: var(--bad); }
  .menu .mi { width: 36px; height: 36px; border-radius: 11px; background: var(--soft); display: grid; place-items: center; flex: none; }

  /* כניסה */
  #auth { max-width: 400px; margin: 8vh auto 0; text-align: center; padding: 28px 20px; }
  #auth img { width: 72px; height: 72px; border-radius: 20px; box-shadow: 0 10px 26px rgba(0, 0, 0, .3); margin-bottom: 12px; }
  #auth h2 { font-size: 22px; margin-bottom: 4px; }
  #auth form { display: grid; gap: 12px; margin-top: 16px; text-align: start; }
  #msg { position: fixed; inset: auto 16px calc(84px + var(--sab)) 16px; max-width: 420px; margin: 0 auto; background: var(--ink); color: var(--bg); padding: 11px 15px; border-radius: 14px; text-align: center; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); z-index: 30; animation: up .2s; }
.ubar{display:grid;grid-template-columns:minmax(0,42%) 1fr auto;gap:8px;align-items:center;padding:5px 0;font-size:14px}.ubar .ut{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ubar .ut small{display:block;opacity:.6;font-size:11px}
.ubar .ub{height:10px;border-radius:5px;background:rgba(127,127,127,.18);overflow:hidden}.ubar .ub i{display:block;height:100%;border-radius:5px;background:#5b8def}.ubar .ub i.ok{background:#2fb673}.ubar b{min-width:28px;text-align:left;font-variant-numeric:tabular-nums}
.ukpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}.ukpi div{padding:10px 6px;border-radius:12px;background:rgba(127,127,127,.12);text-align:center}.ukpi b{display:block;font-size:22px}.ukpi span{font-size:12px;opacity:.7}
.udays{display:flex;align-items:flex-end;gap:4px;height:84px;padding:4px 0 0}.udays span{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}.udays i{display:block;width:100%;min-height:2px;border-radius:4px 4px 0 0;background:#2fb673}.udays small{font-size:10px;opacity:.6}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <img src="icon-192.png" alt="">
  <div><h1>קישורי הפעלה</h1><p id="stamp">חוד · MOVA · קליסתניקס · מאחורי הקלעים</p></div>
  <span class="sp"></span>
  <button class="icon-btn" id="refresh" type="button" aria-label="רענון" hidden><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.300 6.300M20 5v6h-6"/></svg></button>
  <button class="icon-btn" id="settings" type="button" aria-label="הגדרות" hidden><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.400 15a1.700 1.700 0 0 0 .300 1.800l.100.100a2 2 0 1 1-2.800 2.800l-.100-.100a1.700 1.700 0 0 0-2.800 1.200V21a2 2 0 1 1-4 0v-.100a1.700 1.700 0 0 0-2.900-1.200l-.100.100a2 2 0 1 1-2.800-2.800l.100-.100A1.700 1.700 0 0 0 3.200 14H3a2 2 0 1 1 0-4h.100a1.700 1.700 0 0 0 1.200-2.900l-.100-.100a2 2 0 1 1 2.800-2.800l.100.100A1.700 1.700 0 0 0 10 3.200V3a2 2 0 1 1 4 0v.100a1.700 1.700 0 0 0 2.900 1.200l.100-.100a2 2 0 1 1 2.800 2.800l-.100.100A1.700 1.700 0 0 0 20.800 10H21a2 2 0 1 1 0 4h-.100a1.700 1.700 0 0 0-1.500 1z"/></svg></button>
</div></header>

<main>
  <section class="card" id="auth">
    <img src="icon-192.png" alt="">
    <h2 id="authTitle">כניסה</h2>
    <p class="muted small" id="authNote"></p>
    <button class="btn block" id="faceGo" type="button" hidden style="margin-top:16px"><svg class="i" viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 10v1M15 10v1M12 10v3h-1M9 15.500c1.800 1.300 4.200 1.300 6 0"/></svg>כניסה בזיהוי פנים</button>
    <button class="chip" id="usePw" type="button" hidden style="margin-top:12px">כניסה עם סיסמה</button>
    <form id="authForm">
      <label class="f">סיסמה<input id="pw" type="password" autocomplete="current-password" minlength="8" required></label>
      <button class="btn block" id="authGo">כניסה</button>
    </form>
  </section>

  <div id="panel" hidden style="display:grid;gap:14px">
    <div class="stats" id="stats"></div>

    <div class="sec-h"><span>האפליקציות</span><span class="sp"></span><span style="font-weight:500;letter-spacing:0">המתג קובע אם נדרש קישור הפעלה</span></div>
    <div class="apps" id="switches"></div>

    <div class="sec-h"><span>הקישורים</span><span class="sp"></span><span id="count" class="num" style="font-weight:500;letter-spacing:0"></span></div>
    <div class="tools">
      <div class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg><input id="q" type="search" placeholder="חיפוש לפי שם" autocomplete="off" aria-label="חיפוש לפי שם"></div>
      <div class="scroll" id="filter"></div>
      <div class="scroll" id="status"></div>
    </div>
    <div id="list"><div class="skel"></div><div class="skel"></div></div>

async function act(op, o = {}) {

  let days = 30;
  sheet(`<h3>הארכת תוקף</h3><p class="muted">${esc(p.name || '')} · בתוקף עד ${day(p.exp)}</p><div class="opts" data-days>${DURS.map(([v, t]) => `<button type="button" data-v="${v}" class="${v === days ? 'on' : ''}">${t}</button>`).join('')}</div>
    <p class="small" id="exTo"></p><div class="row"><button class="btn" style="flex:2" id="exGo" type="button">הארכה</button><button class="btn ghost" style="flex:1" data-close type="button">ביטול</button></div>`, (sh, close) => {
    const to = () => { sh.querySelector('#exTo').textContent = `התוקף החדש: עד ${day(Math.max(p.exp, Date.now()) + days * 86400e3)}`; }; to();
    sh.querySelector('[data-days]').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; days = +b.dataset.v; sh.querySelectorAll('[data-days] button').forEach(x => x.classList.toggle('on', x === b)); to(); });
    sh.querySelector('#exGo').onclick = () => { close(); run('extend', { id: p.id, days }, 'התוקף הוארך'); };
  });
}
function renameSheet(p) {
  sheet(`<h3>שינוי שם</h3><label class="f">שם<input id="rnName" maxlength="40" value="${esc(p.name)}" autocomplete="off"></label>
    <div class="row"><button class="btn" style="flex:2" id="rnGo" type="button">שמירה</button><button class="btn ghost" style="flex:1" data-close type="button">ביטול</button></div>`, (sh, close) => {
    const inp = sh.querySelector('#rnName'); setTimeout(() => { inp.focus(); inp.select(); }, 250);
    sh.querySelector('#rnGo').onclick = () => { const name = inp.value.trim(); close(); run('rename', { id: p.id, name }, 'השם עודכן'); };
  });
}
// ───── הגדרות ─────
function settingsSheet() {
  const on = faceOn();
  sheet(`<h3>הגדרות</h3><div class="menu">
    ${canFace ? `<button type="button" data-do="face"><span class="mi">${I.face}</span><span>${on ? 'כיבוי זיהוי פנים' : 'כניסה בזיהוי פנים'}<small>${on ? 'פעיל בטלפון הזה. הסיסמה לא נשמרת בטלפון.' : 'הטלפון יאמת פנים או טביעת אצבע בכל פתיחה. הסיסמה נשארת כגיבוי.'}</small></span></button>` : ''}
    <button type="button" data-do="out" class="bad"><span class="mi">${I.out}</span><span>יציאה<small>הסיסמה תימחק מהטלפון הזה</small></span></button></div>
    <p class="muted small">יומן השימוש רושם רק מתי האפליקציה נפתחה (יום ושעה). האימונים, המשקל והתזונה של המשתמשים נשארים בטלפון שלהם.</p>
    <button class="btn ghost block" data-close type="button">סגירה</button>`, (sh, close) => {
    sh.querySelector('.menu').addEventListener('click', async e => { const b = e.target.closest('[data-do]'); if (!b) return; close();
      if (b.dataset.do === 'out') return logout();
      on ? await faceDisable() : await faceEnable(); });
  });
}

$('#refresh').onclick = load; $('#newGo').onclick = newSheet; $('#settings').onclick = settingsSheet;
$('#q').addEventListener('input', e => { q = e.target.value.trim(); if (last) draw(); });
document.addEventListener('click', async e => {
  const pm = e.target.closest('[data-perms]'); if (pm) return permsSheet(pm.dataset.perms);
  const sx = e.target.closest('[data-stats]'); if (sx) return statsSheet(sx.dataset.stats);
  const c = e.target.closest('[data-cfg]'), cp = e.target.closest('[data-copy]'), sh = e.target.closest('[data-share]'), f = e.target.closest('[data-show]'), st = e.target.closest('[data-stat]'), m = e.target.closest('[data-more]');
  if (f) { show = f.dataset.show; return draw(); }
  if (st) { stat = st.dataset.stat; return draw(); }
  if (m) return moreSheet(m.dataset.more);
  if (cp) return navigator.clipboard.writeText(cp.dataset.copy).then(() => say('הקישור הועתק'), () => say('ההעתקה נכשלה'));
  if (sh) return shareLink(sh.dataset.share, sh.dataset.name, sh.dataset.app, +sh.dataset.exp);
  if (c) { const a = c.dataset.cfg;
    if (c.dataset.on && !await ask(`לדרוש קישור הפעלה ב־${HE[a]}?`, 'מי שאין לו קישור בתוקף לא יוכל להיכנס — גם הטלפון הזה. כדאי להנפיק קודם קישור לעצמך.', 'להפעיל')) return;
    if (!c.dataset.on && !await ask(`לפתוח את ${HE[a]} לכולם?`, 'כל מי שמגיע לכתובת של האפליקציה יוכל להשתמש בה, גם בלי קישור.', 'לפתוח לכולם', true)) return;
    const r = await act('cfg', { app: a, enforce: !!c.dataset.on }); if (r.why === 'auth') return; say(r.ok ? 'עודכן' : r.net ? 'אין חיבור לשרת' : 'העדכון נכשל'); return load(); }
});
// חוזרים למסך אחרי זמן: מרעננים לבד
document.addEventListener('visibilitychange', () => { if (!document.hidden && last && !$('#panel').hidden && Date.now() - last.now > 60e3 && !document.querySelector('.ov')) load(); });
// ───── עדכון אוטומטי ─────
// האפליקציה המותקנת נשארת פתוחה בזיכרון, והעמוד נשמר במטמון הדפדפן — לכן בודקים מול השרת בכל פתיחה ובכל חזרה למסך,
// וכשיש גרסה חדשה טוענים אותה מחדש (עם כתובת שעוקפת את המטמון). השורה הבאה מתעדכנת ע״י tools/release.mjs.
const ADMIN_V = '20261124.192240';
async function update() {
  try { const v = (await (await fetch('../version.json?t=' + Date.now(), { cache: 'no-store' })).json()).v;
    if (!v || v === ADMIN_V || new URLSearchParams(location.search).get('v') === v || document.querySelector('.ov')) return;   // לא באמצע פעולה, ולא בלולאה
    location.replace(location.pathname + '?v=' + encodeURIComponent(v));
  } catch { /* אין רשת */ } }
document.addEventListener('visibilitychange', () => { if (!document.hidden) update(); });
addEventListener('pageshow', (e) => { if (e.persisted) update(); });
update();
lock(true); start();
</script>
</body>
</html>
